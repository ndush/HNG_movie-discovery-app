<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#8c1c2b" />
    <meta name="description" content="Tell Matinee your mood and get three movies worth watching tonight." />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400..700&family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&display=swap" rel="stylesheet" />
    <script>
      // Set theme before first paint to avoid a flash.
      try {
        document.documentElement.dataset.theme = localStorage.getItem("matinee:theme") ||
          (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      } catch { document.documentElement.dataset.theme = "dark"; }
    </script>
    <title>Matinee</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
